name: 🔥 Keep Render Server Alive

on:
  schedule:
    # يشغل كل 10 دقائق - هذا هو المفتاح!
    - cron: '*/10 * * * *'
  workflow_dispatch:        # تشغيل يدوي
  push:                     # تشغيل عند التحديث
    branches: [ main, master ]

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: 🕐 عرض الوقت
        run: echo "⏰ بدء التشغيل في $(date +'%Y-%m-%d %H:%M:%S')"
        
      - name: 🌐 زيارة موقع Render
        id: ping
        run: |
          echo "🎯 جاري زيارة: https://burhan-r05o.onrender.com"
          
          # إرسال طلب HTTP مع timeout
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://burhan-r05o.onrender.com/")
          
          echo "📊 كود الاستجابة: $STATUS_CODE"
          echo "status_code=$STATUS_CODE" >> $GITHUB_OUTPUT
          
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ نجحت الزيارة - السيرفر نشط"
          else
            echo "❌ فشل في الاتصال - كود الخطأ: $STATUS_CODE"
            exit 1
          fi
          
      - name: 📝 حفظ السجل
        run: |
          echo "🔄 تمت الزيارة بنجاح في: $(date)" >> render-health.log
          echo "🌐 الموقع: https://burhan-r05o.onrender.com" >> render-health.log
          echo "---" >> render-health.log
          
      - name: 📤 رفع السجلات
        uses: actions/upload-artifact@v4
        with:
          name: render-server-logs
          path: render-health.log
          retention-days: 5
